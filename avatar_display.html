<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO Autonomous - Miles</title>
<style>
  /* ---- Brand colors: swap these for the official GO Car Wash colors ---- */
  :root {
    --bg: #0f1418;
    --miles-color: #ff6a00;      /* GO orange (sampled from the Miles artwork) */
    --text: #ffffff;
    --turn: #ff6a00;             /* TURN WHEEL LEFT / RIGHT */
    --straight: #2ecc71;
    --stop: #ff3b30;
    --conveyor: #00b5ec;
    --wait: #8a949e;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #label { position: fixed; top: 4vh; left: 0; right: 0; text-align: center;
    font-size: clamp(36px, 8vw, 110px); font-weight: 800; letter-spacing: 0.04em;
    color: var(--accent, var(--wait)); text-shadow: 0 4px 24px rgba(0,0,0,0.6); }
  .arrow { position: fixed; top: 50%; width: 22vw; height: 22vw; max-width: 300px; max-height: 300px;
    transform: translateY(-50%); opacity: 0; transition: opacity 0.15s; color: var(--turn); }
  .arrow svg { width: 100%; height: 100%; }
  #arrow-left { left: 4vw; }
  #arrow-right { right: 4vw; }
  #arrow-up { left: 50%; top: auto; bottom: 3vh; transform: translateX(-50%); width: 14vw; height: 14vw;
    max-width: 180px; max-height: 180px; color: var(--straight); }
  .show { opacity: 1 !important; }
  .blink { animation: blink 0.6s infinite alternate; }
  @keyframes blink { from { opacity: 1; } to { opacity: 0.25; } }
  .nudge-left { animation: nudgeL 0.6s infinite alternate ease-in-out; }
  .nudge-right { animation: nudgeR 0.6s infinite alternate ease-in-out; }
  .nudge-up { animation: nudgeU 0.6s infinite alternate ease-in-out; }
  @keyframes nudgeL { from { margin-left: 0; } to { margin-left: -2vw; } }
  @keyframes nudgeR { from { margin-right: 0; } to { margin-right: -2vw; } }
  @keyframes nudgeU { from { margin-bottom: 0; } to { margin-bottom: 2vh; } }
  #status { position: fixed; bottom: 10px; right: 14px; font-size: 13px; opacity: 0.5; }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--wait); margin-right: 6px; }
</style>
<script type="importmap">
  { "imports": { "three": "/assets/vendor/three.module.js" } }
</script>
</head>
<body>
<div id="stage"></div>

<!-- Arrows are plain HTML so they still work if 3D fails. Directions are the DRIVER'S
     (the screen faces the driver, so the driver's left is the screen's left). -->
<div id="arrow-left" class="arrow"><svg viewBox="0 0 100 100"><path d="M62 12 L24 50 L62 88" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="arrow-right" class="arrow"><svg viewBox="0 0 100 100"><path d="M38 12 L76 50 L38 88" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div id="arrow-up" class="arrow"><svg viewBox="0 0 100 100"><path d="M14 64 L50 28 L86 64" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<div id="label">Waiting...</div>
<div id="status"><span class="dot" id="dot"></span><span id="conn">connecting</span></div>

<script>
// ---- Signal -> text/arrows (no 3D needed). Fail-safe: anything unknown or no server = WAIT.
const SIGNALS = {
  MOVE_LEFT:       { text: "TURN WHEEL LEFT",  accent: "--turn",     arrow: "arrow-left",  nudge: "nudge-left" },
  MOVE_RIGHT:      { text: "TURN WHEEL RIGHT", accent: "--turn",     arrow: "arrow-right", nudge: "nudge-right" },
  STRAIGHT:        { text: "STRAIGHT AHEAD",   accent: "--straight", arrow: "arrow-up",    nudge: "nudge-up" },
  STOP:            { text: "STOP",             accent: "--stop",     blink: true },
  CONVEYOR_MOVING: { text: "ENJOY YOUR WASH!", accent: "--conveyor" },
  WAIT:            { text: "Waiting...",       accent: "--wait" },
};
window.currentSignal = "WAIT";

function applySignal(signal) {
  if (!(signal in SIGNALS)) signal = "WAIT";
  window.currentSignal = signal;
  const s = SIGNALS[signal];
  const label = document.getElementById("label");
  label.textContent = s.text;
  label.style.setProperty("--accent", `var(${s.accent})`);
  label.classList.toggle("blink", !!s.blink);
  for (const id of ["arrow-left", "arrow-right", "arrow-up"]) {
    const el = document.getElementById(id);
    const on = s.arrow === id;
    el.classList.toggle("show", on);
    el.classList.remove("nudge-left", "nudge-right", "nudge-up");
    if (on) el.classList.add(s.nudge);
  }
}

async function poll() {
  let ok = false;
  try {
    const res = await fetch("/status", { cache: "no-store", signal: AbortSignal.timeout(1000) });
    const data = await res.json();
    applySignal(data.signal);
    ok = !data.stale;
  } catch (e) {
    applySignal("WAIT");
  }
  document.getElementById("conn").textContent = ok ? "live" : "no pipeline";
  document.getElementById("dot").style.background = ok ? "var(--straight)" : "var(--wait)";
  setTimeout(poll, 250);
}
poll();
</script>


<script type="module">
// ---- 3D Miles, marshalling like an air-traffic controller.
// Miles FACES the driver, so his RIGHT arm is on the screen's LEFT (the driver's left).
// Model space: +X = Miles's left (screen right), +Y up, +Z toward the driver.
// The model has no built-in skeleton: shoulder/elbow bones are added here from
// miles_rig.json (joint positions measured from the mesh).
import * as THREE from "three";
import { GLTFLoader } from "/assets/vendor/GLTFLoader.js";

const stage = document.getElementById("stage");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  console.warn("No WebGL - showing text and arrows only", e);
}

const V = (x, y, z) => new THREE.Vector3(x, y, z).normalize();
const mirror = (v) => new THREE.Vector3(-v.x, v.y, v.z);

// Arm poses as directions: upper arm (U) and forearm (F) for Miles's left arm (L, +X)
// and right arm (R, -X). t = seconds, for waving motions.
function armPose(signal, t) {
  const wave = (a, b, speed) => a.clone().lerp(b, 0.5 + 0.5 * Math.sin(t * speed)).normalize();
  const restL = { U: V(0.3, -0.95, 0.08), F: V(0.22, -0.96, 0.18) };
  const restR = { U: mirror(restL.U), F: mirror(restL.F) };
  switch (signal) {
    case "MOVE_LEFT": // right arm points to screen-left; left arm waves the car that way
      return { R: { U: V(-1, 0.08, 0.2), F: V(-1, 0.1, 0.25) },
               L: { U: V(0.55, 0.8, 0.15), F: wave(V(0.25, 1, 0.1), V(-0.75, 0.6, 0.25), 7) } };
    case "MOVE_RIGHT":
      return { L: { U: V(1, 0.08, 0.2), F: V(1, 0.1, 0.25) },
               R: { U: V(-0.55, 0.8, 0.15), F: wave(V(-0.25, 1, 0.1), V(0.75, 0.6, 0.25), 7) } };
    case "STRAIGHT": // both arms up, beckoning forward
      return { L: { U: V(0.9, 0.35, 0.3), F: wave(V(0.15, 1, 0.1), V(-0.35, 0.75, 0.55), 6) },
               R: { U: V(-0.9, 0.35, 0.3), F: wave(V(-0.15, 1, 0.1), V(0.35, 0.75, 0.55), 6) } };
    case "STOP": // arms crossed above the head, held
      return { L: { U: V(0.5, 0.86, 0.12), F: V(-0.8, 0.55, 0.3) },
               R: { U: V(-0.5, 0.86, 0.12), F: V(0.8, 0.55, 0.18) } };
    case "CONVEYOR_MOVING": // friendly wave
      return { L: { U: V(0.85, 0.5, 0.15), F: wave(V(0.45, 0.9, 0.05), V(-0.25, 0.97, 0.05), 9) },
               R: restR };
    default:
      return { L: restL, R: restR };
  }
}

// Body: small turn/lean toward the direction, bob, etc. turn + = face screen right.
function bodyPose(signal, t) {
  switch (signal) {
    case "MOVE_LEFT":  return { turn: -0.25, lean: 0.06, nod: 0, y: 0 };
    case "MOVE_RIGHT": return { turn: 0.25, lean: -0.06, nod: 0, y: 0 };
    case "STRAIGHT":   return { turn: 0, lean: 0, nod: 0.04 + 0.03 * Math.sin(t * 6), y: 0 };
    case "STOP":       return { turn: 0, lean: 0, nod: 0, y: 0 };
    case "CONVEYOR_MOVING": return { turn: 0.15 * Math.sin(t * 1.5), lean: 0, nod: 0, y: Math.abs(Math.sin(t * 5)) * 0.015 };
    default:           return { turn: 0.12 * Math.sin(t * 0.8), lean: 0, nod: 0, y: 0, dim: true };
  }
}

function smoothstep(a, b, x) { const k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); }

// Build a skinned mesh: bones 0 root, 1 L shoulder, 2 L elbow, 3 R shoulder, 4 R elbow.
function rigMiles(mesh, J) {
  const geom = mesh.geometry;
  const pos = geom.attributes.position;
  const n = pos.count;
  const skinIndex = new Uint16Array(n * 4), skinWeight = new Float32Array(n * 4);
  const arms = {};
  for (const [side, sg, sIdx] of [["L", 1, 1], ["R", -1, 3]]) {
    const sh = new THREE.Vector3(...J[side].shoulder), el = new THREE.Vector3(...J[side].elbow), wr = new THREE.Vector3(...J[side].wrist);
    arms[side] = { sg, sIdx, sh, el, wr,
      dirU: el.clone().sub(sh).normalize(), lenU: el.distanceTo(sh),
      dirAll: wr.clone().sub(sh).normalize(), restF: wr.clone().sub(el).normalize() };
  }
  const p = new THREE.Vector3(), d = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    p.fromBufferAttribute(pos, i);
    const a = arms[p.x >= 0 ? "L" : "R"];
    let wArm = 0, wFore = 0;
    // Only the arm itself moves. Below the shoulder the torso side panels sit
    // right next to the arm, so require the point to be outside the torso width.
    const outsideTorso = a.sg * p.x > (p.y < 0.72 ? 0.12 : 0.09);
    if (outsideTorso) {
      d.copy(p).sub(a.sh);
      const t = d.dot(a.dirAll);
      const r = d.clone().addScaledVector(a.dirAll, -t).length();
      // tight near the shoulder (torso is close), wide further out (spread fingers)
      if (r < (t < 0.08 ? 0.05 : 0.11)) {
        wArm = smoothstep(0.0, 0.04, t);
        wFore = smoothstep(a.lenU - 0.025, a.lenU + 0.025, t);
      }
    }
    skinIndex.set([0, a.sIdx, a.sIdx + 1, 0], i * 4);
    skinWeight.set([1 - wArm, wArm * (1 - wFore), wArm * wFore, 0], i * 4);
  }
  geom.setAttribute("skinIndex", new THREE.Uint16BufferAttribute(skinIndex, 4));
  geom.setAttribute("skinWeight", new THREE.Float32BufferAttribute(skinWeight, 4));

  const root = new THREE.Bone();
  const bones = [root];
  for (const side of ["L", "R"]) {
    const a = arms[side];
    const shoulder = new THREE.Bone(); shoulder.position.copy(a.sh); root.add(shoulder);
    const elbow = new THREE.Bone(); elbow.position.copy(a.el).sub(a.sh); shoulder.add(elbow);
    a.shoulder = shoulder; a.elbow = elbow;
    bones.push(shoulder, elbow);
  }
  const skinned = new THREE.SkinnedMesh(geom, mesh.material);
  skinned.add(root);
  skinned.updateMatrixWorld(true);  // bones need world matrices before bind
  skinned.bind(new THREE.Skeleton(bones));
  return { skinned, arms };
}

if (renderer) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
  camera.position.set(0, 0.62, 3.5);
  camera.lookAt(0, 0.7, 0);   // aims above his head center so he sits low, under the label

  scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.0);
  key.position.set(1.5, 2.5, 2.5);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x88ddff, 1.2);
  rim.position.set(-2, 1.5, -2);
  scene.add(rim);

  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.3, 48),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.35 }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.001;
  scene.add(shadow);

  const pivot = new THREE.Group();   // body turn/lean around his feet
  scene.add(pivot);
  let rig = null;

  // GO logo patch on his chest (drawn, so it stays sharp at any size).
  function makeLogo(chest) {
    const cv = document.createElement("canvas"); cv.width = cv.height = 256;
    const g = cv.getContext("2d");
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(128, 128, 124, 0, Math.PI * 2); g.fill();
    g.lineWidth = 14; g.strokeStyle = "#111"; g.beginPath(); g.arc(128, 128, 104, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "#111"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "900 120px Arial Black, Arial"; g.fillText("GO", 128, 118);
    g.font = "700 30px Arial"; g.fillText("CAR WASH", 128, 192);
    const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.Mesh(new THREE.CircleGeometry(0.045, 48),
      new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6, polygonOffset: true, polygonOffsetFactor: -2 }));
    m.position.set(chest[0], chest[1], chest[2] + 0.004);
    return m;
  }

  // Textured Meshy model first; fall back to the vertex-painted one if it's missing.
  // Both are the same shape, so the joints in miles_rig.json fit either one.
  async function loadMiles() {
    const J = await fetch("/assets/miles_rig.json").then((r) => r.json());
    let gltf, textured = true;
    try {
      gltf = await new GLTFLoader().loadAsync("/assets/miles_textured.glb");
    } catch (e) {
      console.warn("Textured Miles not found, using painted version", e);
      gltf = await new GLTFLoader().loadAsync("/assets/miles_rig.glb");
      textured = false;
    }
    let mesh = null;
    gltf.scene.traverse((o) => { if (o.isMesh && !mesh) mesh = o; });
    const geom = mesh.geometry;
    // Same normalization as the prep script: feet at y=0, centered, 1 unit tall.
    geom.computeBoundingBox();
    const bb = geom.boundingBox, h = bb.max.y - bb.min.y;
    geom.translate(-(bb.min.x + bb.max.x) / 2, -bb.min.y, -(bb.min.z + bb.max.z) / 2);
    geom.scale(1 / h, 1 / h, 1 / h);
    if (textured) {
      // Meshy marks it fully metallic; with no reflections to show, metal renders dark.
      mesh.material.metalness = 0.15;
      mesh.material.roughness = 0.75;
    } else {
      geom.computeVertexNormals();
      const colors = geom.attributes.color;
      if (colors) {  // stored as sRGB bytes -> convert to linear for correct brightness
        const c = new THREE.Color();
        for (let i = 0; i < colors.count; i++) {
          c.setRGB(colors.getX(i), colors.getY(i), colors.getZ(i)).convertSRGBToLinear();
          colors.setXYZ(i, c.r, c.g, c.b);
        }
      }
      mesh.material = new THREE.MeshStandardMaterial({ vertexColors: !!colors, roughness: 0.5, metalness: 0.05 });
    }
    rig = rigMiles(mesh, J);
    pivot.add(rig.skinned);
    if (!textured) pivot.add(makeLogo(J.chest));  // the textured model has the real logo
  }
  loadMiles().catch((err) => console.error("Could not load Miles", err));

  const cur = { turn: 0, lean: 0, nod: 0, y: 0 };
  const clock = new THREE.Clock();
  const qTarget = new THREE.Quaternion(), qF = new THREE.Quaternion(), qInv = new THREE.Quaternion();

  function aimArm(a, pose, k) {
    // shoulder: rotate the rest upper-arm direction onto the target direction
    qTarget.setFromUnitVectors(a.dirU, pose.U);
    a.shoulder.quaternion.slerp(qTarget, k);
    // elbow: make the forearm point along pose.F in model space
    qF.setFromUnitVectors(a.restF, pose.F);
    qInv.copy(a.shoulder.quaternion).invert();
    a.elbow.quaternion.slerp(qInv.multiply(qF), k);
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // Back the camera off on narrow/portrait screens so outstretched arms (~0.65 each side) fit.
    const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    const dist = Math.max(3.5, 0.7 / (Math.tan(halfFov) * camera.aspect));
    camera.position.set(0, 0.62, dist);
    camera.lookAt(0, 0.7 - (dist - 3.5) * 0.04, 0);
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize);
  resize();

  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1);
    const t = clock.elapsedTime;
    const sig = window.currentSignal;
    const b = bodyPose(sig, t);
    const k = Math.min(1, dt * 7);
    cur.turn += (b.turn - cur.turn) * k;
    cur.lean += (b.lean - cur.lean) * k;
    cur.nod += (b.nod - cur.nod) * k;
    cur.y += (b.y - cur.y) * k;
    pivot.rotation.set(cur.nod, cur.turn, cur.lean);
    pivot.position.y = cur.y;
    key.intensity += ((b.dim ? 1.2 : 2.0) - key.intensity) * k;
    if (rig) {
      const pose = armPose(sig, t);
      const ka = Math.min(1, dt * 10);
      aimArm(rig.arms.L, pose.L, ka);
      aimArm(rig.arms.R, pose.R, ka);
    }
    renderer.render(scene, camera);
  });
}
</script>
</body>
</html>
